# IT Service Desk - managed block
server {
  listen 80;
  listen [::]:80;
  server_name it.tianhejiaoyu.cn;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name it.tianhejiaoyu.cn;
  server_tokens off;
  client_max_body_size 30m;

  ssl_certificate /etc/letsencrypt/live/it.tianhejiaoyu.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/it.tianhejiaoyu.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:ITDeskTLS:10m;
  ssl_session_timeout 1d;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_pass http://itdesk:3000;
  }
}
# End IT Service Desk - managed block
