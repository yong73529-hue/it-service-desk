services:
  itdesk:
    build:
      context: .
      dockerfile: Dockerfile.server-update
    image: it-service-desk:latest
    container_name: it-service-desk
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3200:3000"
    volumes:
      - ./data:/data
      - ./uploads:/data/uploads
    networks:
      default:
      edge:
        aliases:
          - itdesk
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  edge:
    external: true
    name: tianhe-yunxue_app
